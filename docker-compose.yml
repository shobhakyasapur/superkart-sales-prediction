services:
  backend:
    build:
      context: ./backend_files
    container_name: backend
    ports:
      - "7860:7860"
    networks:
      - superkart-app-network

  frontend:
    build:
      context: ./frontend_files
    container_name: frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - superkart-app-network

networks:
  superkart-app-network:
    driver: bridge
